name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runs on the self-hosted macOS runner (an Apple-silicon Mac with Xcode 26+
# already installed). GitHub-hosted minutes are limited, so the cloud
# equivalent of build-test lives in ci-cloud.yml and is manual-trigger only.
#
# Fork PRs from outside collaborators require manual approval before any job
# runs here (repo setting: fork-pr-contributor-approval = all_external_
# contributors), because a self-hosted runner executes PR code on real hardware.

jobs:
  lint:
    name: swift-format lint
    runs-on: [self-hosted, macOS, roomlens]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Mirrors Scripts/hooks/lint-gate.sh, which blocks a local commit when a
      # staged Swift file fails `swift-format lint --strict`.
      - name: Lint
        run: |
          set -o pipefail
          xcrun swift-format lint --strict --recursive \
            RoomLens RoomLensTests RoomLensUITests

  build-test:
    name: Build & Test
    runs-on: [self-hosted, macOS, roomlens]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      # xcbeautify is expected to be on the runner already; install only if not.
      - name: Ensure xcbeautify
        run: command -v xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      # The canonical simulator is "iPhone 17 Pro" on iOS 26.x (see AGENTS.md).
      # Resolve a concrete available iPhone and fall back to any iPhone rather
      # than hard-failing if the installed device set changes.
      - name: Resolve simulator
        run: |
          name=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone 17 Pro( Max)?' | head -1)
          if [ -z "$name" ]; then
            name=$(xcrun simctl list devices available \
              | grep -Eo 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          fi
          if [ -z "$name" ]; then
            echo "No iOS Simulator available on this runner" >&2
            exit 1
          fi
          echo "SIM_NAME=$name" >> "$GITHUB_ENV"
          echo "Using simulator: $name"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project RoomLens.xcodeproj \
            -scheme RoomLens \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            | xcbeautify

      - name: Test
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project RoomLens.xcodeproj \
            -scheme RoomLens \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
